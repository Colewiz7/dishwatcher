name: build

on:
  push:
    branches: [main, v2-rebuild]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          python -m pip install --upgrade pip
          # the real server requirements, not just the cv ones: the privacy
          # tests import the app, and installing the actual set means a broken
          # import fails here rather than at deploy time
          pip install -r server/requirements.txt pytest
      - name: test
        run: pytest tests/ -v

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # without this the built-in token cannot push to ghcr and the job fails
      # at the login step. v1 had no workflow at all, which is why
      # ghcr.io/colewiz7/dishwatcher returned 404 while the k8s manifests
      # happily referenced it.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
      # Build once without pushing and import the app inside it. The unit
      # tests run from the source tree, so they cannot catch a module that
      # exists in git but was never copied into the image. That shipped a
      # crash-looping image once.
      - name: the image must actually start
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          push: false
          tags: dishwatcher:ci
      - run: docker run --rm dishwatcher:ci python -c "import server; print(len(server.app.routes), 'routes')"

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          # amd64 only: the server half runs on the k3s node. The camera half
          # is not containerised, it runs as a systemd unit on the Pi, so there
          # is nothing here that needs an arm64 image.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
